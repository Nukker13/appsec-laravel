volumes:
  lab_vendor:

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: no
    working_dir: /labs/stored_xss
    volumes:
      - ../:/labs/stored_xss:delegated
      # keep the image's composer vendor/ visible under the source bind mount (as in oauth-ato)
      - lab_vendor:/labs/stored_xss/vendor
      - ./storage/tmp:/tmp
  nginx:
    image: nginx:1.29
    depends_on:
      - app
    restart: no
    volumes:
      - ../:/labs/stored_xss
      - ./nginx:/etc/nginx/conf.d
    networks:
      - default
      - labs_proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=labs_proxy
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${LAB_HOST}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=web
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80
  db:
    image: mysql:8.0
    volumes:
      - ./storage/mysql:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: root
  selenium:
    image: seleniarm/standalone-chromium:latest
    shm_size: 512m
    depends_on:
      - nginx
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    depends_on:
      - selenium
      - nginx

networks:
  labs_proxy:
    external: true




